services:
  news-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_aggregator_app
    ports:
      - "${PORT:-3000}:80"
    environment:
      - PORT=${PORT:-3000}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
